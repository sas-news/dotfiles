# tmux config — Ghostty truecolor host, TPM + catppuccin (mocha)
# Prefix: default C-b (kept)

# Auto-install TPM if missing (sudo-free git clone)
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' 'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

# Truecolor + terminal
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"

# Ergonomics
set-option -g mouse on
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi

# Vim-style pane moves + resizes (prefix kept C-b)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
# Splits keep current directory
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# Reload config without restart
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# copy-mode selection (yank owns y: xsel locally, OSC52 over SSH).
bind-key -T copy-mode-vi v send-keys -X begin-selection

# nvim-friendly trio
set-option -sg escape-time 0
set-option -g focus-events on
set-option -g history-limit 50000

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# Clipboard over SSH too: OSC52 passthrough (Ghostty supports it).
# Locally yank uses xsel; over SSH it falls back to OSC52 to your PC.
set-option -s set-clipboard on
set-option -g allow-passthrough on

# catppuccin flavor (legacy spelling: @catppuccin_flavour)
set -g @catppuccin_flavor 'mocha'
# @catppuccin_flavour 'mocha' (legacy spelling)
set -g @catppuccin_window_status_style 'rounded'

# Status line (catppuccin modules, dependency-free set)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# TPM bootstrap (keep LAST)
run '~/.tmux/plugins/tpm/tpm'

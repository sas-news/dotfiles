# Minimal mise pins for single Arch Linux host (Stage-1 management base).
# Trusted/installed via `.bin/arch-setup.sh` (`mise trust` + `mise install`).
# No Nix, no LLM plugins (see docs/adr-001-management-base.md).

[tools]
ripgrep = "latest"
fd = "latest"
node = "lts"
"lua-language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:tree-sitter-cli" = "latest"
stylua = "latest"
ruff = "latest"
"npm:prettier" = "latest"
